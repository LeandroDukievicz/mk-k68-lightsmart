name: mk-k68-lightsmart
title: MK-K68-LightSmart
base: core24
version: '0.1.0'
summary: RGB and dot-matrix control for the 68-key LightSmart keyboard
description: |
  Control panel for 68-key mechanical keyboards that carry a 65x5
  dot-matrix LED strip above the function row -- the hardware whose
  vendor software only ships for Windows.

  Speaks the keyboard's own vendor HID protocol, so no firmware change is
  involved:

    * per-key RGB colours and the built-in lighting animations
    * dot-matrix strip: brightness and frame animations
    * key remapping and macros

  The keyboard must be connected by cable, with its switch in wired mode;
  the vendor interface is not exposed over the wireless link.

  Access to the keyboard needs a udev rule, which a snap cannot install
  for you. A copy ships at:

    /snap/mk-k68-lightsmart/current/udev/60-mk-k68-lightsmart.rules

  Copy it to /etc/udev/rules.d/, then reload with `udevadm control
  --reload-rules` and `udevadm trigger --action=add
  --subsystem-match=hidraw`. The rule is deliberately scoped to the
  keyboard's vendor interface: the other two carry the keys you type.

  Built classic because on a desktop no snap interface grants access to
  a /dev/hidraw node -- snapd's hidraw interface is only slotted by
  gadget snaps. The app opens nothing else.

license: GPL-3.0-or-later
contact: https://github.com/LeandroDukievicz/mk-k68-lightsmart/issues
issues: https://github.com/LeandroDukievicz/mk-k68-lightsmart/issues
source-code: https://github.com/LeandroDukievicz/mk-k68-lightsmart
icon: snap/gui/mk-k68-lightsmart.png

confinement: classic
grade: devel

platforms:
  amd64:
  arm64:

apps:
  mk-k68-lightsmart:
    command: bin/mk-k68-lightsmart
  gui:
    command: bin/mk-k68-lightsmart-gui
    desktop: usr/share/applications/mk-k68-lightsmart.desktop

parts:
  tool:
    plugin: python
    source: .
    # A classic snap gets no system interpreter from snapcraft, so the
    # part must provision its own or the build stops at
    # "No suitable Python interpreter found".
    #
    # The Qt libraries come too. patchelf points every binary at the
    # core24 loader, which searches the base snap rather than the host,
    # so anything Qt links against has to be inside the snap -- without
    # these, importing PySide6.QtGui fails on libGL.so.1.
    stage-packages:
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - libgl1
      - libegl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-glx0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-util1
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libfontconfig1
      - libfreetype6
      - libharfbuzz0b
      - libdbus-1-3
    # Classic snaps are not relocated unless this is set, so the staged
    # interpreter and Qt's shared objects would keep build-time rpaths.
    build-attributes:
      - enable-patchelf
    # Changing anything above re-runs this part's build over the install
    # directory the last one left, and `python -m venv` will not build a
    # venv on top of a venv: it stops at "ensurepip returned non-zero".
    # After editing this part, clean it first:
    #     snapcraft clean tool && snapcraft pack
    override-prime: |
      craftctl default
      # The python plugin builds a venv inside the build container, so
      # pyvenv.cfg records that container's interpreter (/usr/bin) and
      # the entry points get `#!/usr/bin/env python3`. Left alone, the
      # snap runs the *host's* python, which cannot see the snap's
      # site-packages -- "No module named 'mk_k68_lightsmart'".
      #
      # Point both at the interpreter this snap ships. The path is the
      # `current` symlink, which is what snapcraft's own patchelf uses
      # for the base snap's libraries.
      #
      # The shebang must name the venv's own bin/python3, not the
      # interpreter it links to: Python only reads pyvenv.cfg -- and so
      # only finds site-packages -- when the executable it was started
      # as lives inside the venv. Naming usr/bin/python3.12 directly
      # builds and installs cleanly and then cannot import the app.
      snap_root=/snap/mk-k68-lightsmart/current
      sed -i "s|^home = .*|home = $snap_root/usr/bin|" pyvenv.cfg
      sed -i "1s|.*|#!$snap_root/bin/python3|" \
        bin/mk-k68-lightsmart bin/mk-k68-lightsmart-gui

      # PySide6-Essentials still carries Qt Quick, QML, Designer, the
      # 3D and multimedia stacks and a QML-based control set -- 120 MB
      # of it -- and this app imports QtCore, QtGui and QtWidgets. Keep
      # those and what the platform plugins need, drop the rest.
      qt=lib/python3.12/site-packages/PySide6
      keep="Core Gui Widgets DBus Network OpenGL Svg XcbQpa"
      for so in "$qt"/Qt/lib/libQt6*.so*; do
        name=$(basename "$so"); module=${name#libQt6}; module=${module%%.so*}
        case "$module" in Wayland*) continue;; esac
        case " $keep " in *" $module "*) ;; *) rm -f "$so";; esac
      done
      # Bindings for the modules that just went, and the data only they
      # read. Translations go too: Qt falls back to English, which is
      # what this app is written in.
      for binding in "$qt"/Qt*.abi3.so; do
        name=$(basename "$binding" .abi3.so)
        case "$name" in
          QtCore|QtGui|QtWidgets|QtDBus|QtNetwork|QtOpenGL|QtSvg) ;;
          *) rm -f "$binding";;
        esac
      done
      rm -rf "$qt"/Qt/qml "$qt"/Qt/translations "$qt"/Qt/metatypes \
             "$qt"/Qt/libexec "$qt"/Qt/plugins/sqldrivers \
             "$qt"/Qt/plugins/multimedia "$qt"/Qt/plugins/qmltooling \
             "$qt"/Qt/plugins/designer "$qt"/Qt/plugins/virtualkeyboard \
             "$qt"/Qt/plugins/renderers "$qt"/Qt/plugins/sceneparsers \
             "$qt"/Qt/plugins/geometryloaders

  # The desktop file lives in desktop/, not snap/gui/: snapcraft copies
  # everything under snap/gui/ into meta/gui, and the `desktop:` key on
  # the app installs its own copy, so a file in both places puts the app
  # in the menu twice.
  integration:
    plugin: dump
    source: .
    organize:
      desktop/mk-k68-lightsmart.desktop: usr/share/applications/mk-k68-lightsmart.desktop
      udev/60-mk-k68-lightsmart.rules: udev/60-mk-k68-lightsmart.rules
    stage:
      - usr/share/applications/mk-k68-lightsmart.desktop
      - udev/60-mk-k68-lightsmart.rules
