name: mk-k68-lightsmart
title: MK-K68-LightSmart
base: core24
version: '0.1.0'
summary: RGB and dot-matrix control for the 68-key LightSmart keyboard
description: |
  Control panel for 68-key mechanical keyboards that carry a 65x5
  dot-matrix LED strip above the function row -- the hardware whose
  vendor software only ships for Windows.

  Speaks the keyboard's own vendor HID protocol, so no firmware change is
  involved:

    * per-key RGB colours and the built-in lighting animations
    * dot-matrix strip: brightness and frame animations
    * key remapping and macros

  The keyboard must be connected by cable, with its switch in wired mode;
  the vendor interface is not exposed over the wireless link.

  Access to the keyboard needs a udev rule, which a snap cannot install
  for you. A copy ships at:

    /snap/mk-k68-lightsmart/current/udev/60-mk-k68-lightsmart.rules

  Copy it to /etc/udev/rules.d/, then reload with `udevadm control
  --reload-rules` and `udevadm trigger --action=add
  --subsystem-match=hidraw`. The rule is deliberately scoped to the
  keyboard's vendor interface: the other two carry the keys you type.

  Built classic because on a desktop no snap interface grants access to
  a /dev/hidraw node -- snapd's hidraw interface is only slotted by
  gadget snaps. The app opens nothing else.

license: GPL-3.0-or-later
contact: https://github.com/LeandroDukievicz/mk-k68-lightsmart/issues
issues: https://github.com/LeandroDukievicz/mk-k68-lightsmart/issues
source-code: https://github.com/LeandroDukievicz/mk-k68-lightsmart
icon: snap/gui/mk-k68-lightsmart.png

confinement: classic
grade: devel

platforms:
  amd64:
  arm64:

apps:
  mk-k68-lightsmart:
    command: bin/mk-k68-lightsmart
  gui:
    command: bin/mk-k68-lightsmart-gui
    desktop: usr/share/applications/mk-k68-lightsmart.desktop

parts:
  tool:
    plugin: python
    source: .
    # A classic snap gets no system interpreter from snapcraft, so the
    # part must provision its own or the build stops at
    # "No suitable Python interpreter found".
    stage-packages:
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
    # Classic snaps are not relocated unless this is set, so the staged
    # interpreter and Qt's shared objects would keep build-time rpaths.
    build-attributes:
      - enable-patchelf

  integration:
    plugin: dump
    source: .
    organize:
      snap/gui/mk-k68-lightsmart.desktop: usr/share/applications/mk-k68-lightsmart.desktop
      udev/60-mk-k68-lightsmart.rules: udev/60-mk-k68-lightsmart.rules
    stage:
      - usr/share/applications/mk-k68-lightsmart.desktop
      - udev/60-mk-k68-lightsmart.rules
